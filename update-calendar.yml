name: Update calendar

on:
  schedule:
    # 05:17 and 23:17 UTC. Odd minutes are deliberate - GitHub's scheduler is
    # heavily oversubscribed on the hour and delays jobs that ask for :00.
    - cron: "17 5,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: pip install -r requirements.txt

      # The cache key MUST include the Playwright version. Each release expects a
      # specific Chromium build, so a version-less key keeps restoring an old
      # browser, reports a cache hit, and the real binary never gets downloaded.
      - name: Resolve Playwright version
        id: pw
        run: |
          PW_VERSION=$(pip show playwright | awk '/^Version:/ {print $2}')
          echo "Playwright $PW_VERSION"
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Run unconditionally. With a warm cache the download is skipped in a few
      # seconds, and it guarantees the binary is actually present.
      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Build calendar
        id: build
        continue-on-error: true
        run: python scripts/build_calendar.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain docs/)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Update fixtures ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      # Publishing a partial calendar is better than publishing none, but the run
      # must still go red so the gap is visible rather than silently tolerated.
      - name: Fail if a source was skipped
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::A fixture source failed - see the 'Build calendar' step log."
          exit 1
